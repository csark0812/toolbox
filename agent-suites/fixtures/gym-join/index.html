<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join Ironworks Gym</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="join">
      <h1>Join Ironworks</h1>
      <form class="join-form" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input id="name" name="name" required autocomplete="name" placeholder=" " />
          <p class="field-error" id="name-error" hidden>Please tell us your name.</p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            placeholder=" "
          />
          <p class="field-error" id="email-error" hidden>
            That doesn't look like an email address.
          </p>
        </div>
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder=" " />
        </div>
        <div class="field">
          <label for="start">Start date</label>
          <input id="start" name="start" type="date" required />
          <p class="field-error" id="start-error" hidden>Pick the day you'd like to start.</p>
        </div>
        <button class="join-submit" type="submit">Join</button>
      </form>
    </main>
    <script>
      for (const input of document.querySelectorAll('.join-form input')) {
        const error = document.getElementById(`${input.id}-error`)
        const show = () => {
          const invalid = !input.checkValidity()
          input.toggleAttribute('aria-invalid', invalid)
          if (invalid) input.setAttribute('aria-invalid', 'true')
          if (error) error.hidden = !invalid
        }
        input.addEventListener('blur', show)
        input.addEventListener('input', () => input.hasAttribute('aria-invalid') && show())
      }
    </script>
  </body>
</html>
