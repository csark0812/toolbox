<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery guide</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="gallery">
        <h1>Ceramics</h1>
        <article class="card">
          <h2>Moon jar</h2>
          <p class="caption">Porcelain, Joseon dynasty, 18th century</p>
          <span class="badge">New</span>
        </article>
      </section>
      <section class="gallery" data-theme="dark">
        <h1>Photography</h1>
        <article class="card">
          <h2>Harbour at dusk</h2>
          <p class="caption">Gelatin silver print, 1954</p>
          <span class="badge">New</span>
        </article>
      </section>
    </main>
  </body>
</html>
