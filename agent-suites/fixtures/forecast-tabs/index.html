<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mountain forecast</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="forecast">
      <div class="tablist" role="tablist" aria-label="Forecast day">
        <button class="tab" role="tab" aria-selected="true">Today</button>
        <button class="tab" role="tab" aria-selected="false">Tomorrow</button>
        <button class="tab" role="tab" aria-selected="false">Weekend</button>
        <button class="tab" role="tab" aria-selected="false" aria-disabled="true">Outlook</button>
      </div>
      <section class="panel" role="tabpanel">
        <h2>Today</h2>
        <p>Cloud lifting from the tops by midday. Wind 20 to 30 mph on the summits.</p>
      </section>
    </main>
  </body>
</html>
