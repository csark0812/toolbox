<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Riverside Chess Club ladder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>Club ladder</h1>
      <select class="theme-menu" aria-label="Theme">
        <option value="">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </header>
    <main class="ladder">
      <ol>
        <li class="ladder-row">
          <span class="rank-badge">1</span> Ama Boateng <span class="rating">1912</span>
        </li>
        <li class="ladder-row">
          <span class="rank-badge">2</span> Piotr Nowak <span class="rating">1874</span>
        </li>
        <li class="ladder-row">
          <span class="rank-badge">3</span> Kemi Adeyemi <span class="rating">1850</span>
        </li>
      </ol>
    </main>
  </body>
</html>
