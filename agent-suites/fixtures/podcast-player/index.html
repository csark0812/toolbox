<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allotment Hour</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>Allotment Hour</h1>
      <p>Muddy boots, honest advice.</p>
    </header>
    <main>
      <ol class="episodes">
        <li class="episode">
          <button class="episode-play" aria-label="Play episode 42">▶</button>
          <span class="episode-title">42. Garlic in October</span>
          <span class="episode-length">38:12</span>
        </li>
        <li class="episode">
          <button class="episode-play" aria-label="Play episode 41">▶</button>
          <span class="episode-title"
            >41. Everything you ever wanted to know about leaf mould but were too afraid to ask your
            neighbour on the next plot</span
          >
          <span class="episode-length">1:02:45</span>
        </li>
        <li class="episode">
          <button class="episode-play" aria-label="Play episode 40">▶</button>
          <span class="episode-title">40. Slugs: a love story</span>
          <span class="episode-length">44:03</span>
        </li>
      </ol>
    </main>
    <footer class="player">
      <button class="player-toggle" aria-label="Pause">❚❚</button>
      <span class="player-now">Now playing: 42. Garlic in October</span>
      <progress class="player-progress" max="100" value="35"></progress>
    </footer>
  </body>
</html>
