<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guided tours · Hartwell walled garden</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="site-nav">
      <a href="/">Home</a>
      <a href="/tours">Tours</a>
      <a href="/visit">Plan a visit</a>
    </nav>
    <main class="tours">
      <article class="tour-card">
        <img src="https://example.invalid/tours/rose.jpg" alt="" />
        <div class="tour-body">
          <h2>Rose garden at dusk</h2>
          <p class="tour-meta">Sat 7 Nov, 16:00 · 45 min</p>
        </div>
        <div class="tour-actions">
          <button class="book" type="button">Book a place</button>
        </div>
      </article>
      <article class="tour-card">
        <img src="https://example.invalid/tours/orchid.jpg" alt="" />
        <div class="tour-body">
          <h2>Glasshouse orchids</h2>
          <p class="tour-meta">Sun 8 Nov, 11:00 · 1 hour</p>
        </div>
        <div class="tour-actions">
          <button class="book" type="button">Book a place</button>
        </div>
      </article>
      <article class="tour-card">
        <img src="https://example.invalid/tours/kitchen.jpg" alt="" />
        <div class="tour-body">
          <h2>Kitchen garden for families</h2>
          <p class="tour-meta">Sun 8 Nov, 14:00 · 1 hour</p>
        </div>
        <div class="tour-actions">
          <button class="book" type="button">Book a place</button>
        </div>
      </article>
      <article class="tour-card">
        <img src="https://example.invalid/tours/winter.jpg" alt="" />
        <div class="tour-body">
          <h2>Winter structure walk</h2>
          <p class="tour-meta">Sat 14 Nov, 10:30 · 90 min</p>
        </div>
        <div class="tour-actions">
          <button class="book" type="button">Book a place</button>
        </div>
      </article>
    </main>
  </body>
</html>
