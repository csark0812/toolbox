<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Autumn contest entries</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>Autumn contest</h1>
      <p>42 entries · voting closes Sunday</p>
    </header>
    <main class="gallery">
      <article class="card">
        <img
          class="card-photo"
          src="https://example.invalid/entries/101.jpg"
          alt="Fog over the reservoir at dawn"
        />
        <div class="card-body">
          <h2 class="card-title">Reservoir, 6:12am</h2>
          <p class="card-credit">@margot_lens</p>
          <ul class="card-tags">
            <li class="tag">landscape</li>
            <li class="tag">fog</li>
          </ul>
        </div>
      </article>
      <article class="card">
        <img
          class="card-photo"
          src="https://example.invalid/entries/102.jpg"
          alt="A heron lifting off the canal"
        />
        <div class="card-body">
          <h2 class="card-title">Lift-off</h2>
          <p class="card-credit">@westfield_wildlife_and_waterways_photography_collective</p>
          <ul class="card-tags">
            <li class="tag">wildlife</li>
            <li class="tag">birds-in-flight</li>
            <li class="tag">canal</li>
            <li class="tag">long-exposure-experiments</li>
            <li class="tag">monochrome</li>
          </ul>
        </div>
      </article>
      <article class="card">
        <img
          class="card-photo"
          src="https://example.invalid/entries/103.jpg"
          alt="Market stalls under string lights"
        />
        <div class="card-body">
          <h2 class="card-title">Night market</h2>
          <p class="card-credit">@dev.k</p>
          <ul class="card-tags">
            <li class="tag">street</li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
