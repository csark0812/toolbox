<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Files</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app">
      <nav class="sidebar">Folders</nav>
      <main class="content">
        <ul class="file-list">
          <li class="file-row">
            <img class="icon" src="" alt="" />
            <div class="details">
              <span class="name">notes.txt</span>
              <span class="modified">Today</span>
            </div>
            <span class="size">2 KB</span>
          </li>
          <li class="file-row">
            <img class="icon" src="" alt="" />
            <div class="details">
              <span class="name"
                >quarterly-planning-review-final-version-with-comments-from-finance-and-legal.pdf</span
              >
              <span class="modified">Yesterday</span>
            </div>
            <span class="size">4.2 MB</span>
          </li>
        </ul>
      </main>
    </div>
  </body>
</html>
