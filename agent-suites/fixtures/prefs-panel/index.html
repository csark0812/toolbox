<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notifications</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="prefs">
      <h1>Notifications</h1>
      <label class="switch">
        <input class="switch__input" type="checkbox" role="switch" checked />
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label">Weekly summary email</span>
      </label>
      <label class="switch">
        <input class="switch__input" type="checkbox" role="switch" />
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label">Text me when an order ships</span>
      </label>
      <label class="switch">
        <input class="switch__input" type="checkbox" role="switch" checked disabled />
        <span class="switch__track"><span class="switch__thumb"></span></span>
        <span class="switch__label">Security alerts (always on)</span>
      </label>
    </section>
  </body>
</html>
