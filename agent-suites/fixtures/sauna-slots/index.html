<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book the harbour sauna</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Book a sauna slot</h1>
      <section class="day">
        <h2>Saturday 7 November</h2>
        <ul class="slot-list">
          <li>
            <button class="slot" type="button">
              07:00<span class="slot-spaces">3 spaces</span>
            </button>
          </li>
          <li>
            <button class="slot" type="button" disabled>
              08:30<span class="slot-spaces">Full</span>
            </button>
          </li>
          <li>
            <button class="slot" type="button">
              10:00<span class="slot-spaces">5 spaces</span>
            </button>
          </li>
          <li>
            <button class="slot" type="button" disabled>
              17:30<span class="slot-spaces">Full</span>
            </button>
          </li>
        </ul>
      </section>
      <section class="day">
        <h2>Sunday 8 November</h2>
        <ul class="slot-list">
          <li>
            <button class="slot" type="button" disabled>
              07:00<span class="slot-spaces">Full</span>
            </button>
          </li>
          <li>
            <button class="slot" type="button">
              08:30<span class="slot-spaces">1 space</span>
            </button>
          </li>
          <li>
            <button class="slot" type="button">
              10:00<span class="slot-spaces">6 spaces</span>
            </button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
