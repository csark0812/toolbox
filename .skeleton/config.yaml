# yaml-language-server: $schema=node_modules/@csark0812/skeleton/schemas/config.schema.json

scan:
  include:
    - 'README.md'
    - 'AGENTS.md'
    - 'docs/**'
    - '.skeleton/registry.md'
    - 'agent-suites/README.md'
    - 'subagents/**'
    - 'code-review/**'
    - 'crystallize/**'
    - 'grill/**'
    - 'second-opinion/**'
    - 'investigate/**'
    - 'iterate/**'
    - 'diagnose/**'
    - 'tdd/**'
    - 'prototype/**'
    - 'domain-model/**'
    - 'handoff/**'
    - 'writing-great-skills/**'
  exclude:
    - '.skeleton/references/**'
    - '**/references/**'
    # Install mirrors for Cursor/Codex — SSOT is flat <slug>/; do not treat as registry rows.
    - '.agents/skills/**'
    - '.claude/skills/**'
  banned: []
  retiredSkills:
    - multi
    - iterative-review
    - branch-cleanup
    - product-principles
    - testing
    - pull-request
    - domain-modeling
    - debug

daysUntilStale: 180

# Hub owns tip bodies even though skills-lock.json uses sourceType: github (install identity).
skillOwnership:
  lockfile: skills-lock.json
  ownedSlugs:
    - subagents
    - code-review
    - crystallize
    - grill
    - second-opinion
    - investigate
    - iterate
    - diagnose
    - tdd
    - prototype
    - domain-model
    - handoff
    - writing-great-skills
